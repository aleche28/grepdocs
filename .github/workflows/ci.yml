name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # only cancel on PR updates, while pushes on main still get their own run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/api/go.mod
          cache-dependency-path: src/api/go.sum
      - name: tidy
        run: make tidy-check
      - name: vet
        run: make vet
      - name: build
        run: make build
      - name: test
        run: make test-race

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/api/go.mod
          cache-dependency-path: src/api/go.sum
      # one version for CI and the dev container: the ARG in .devcontainer/Dockerfile
      - name: golangci-lint version
        id: golangci-lint-version
        run: |
          version=$(sed -n 's/^ARG GOLANGCI_LINT_VERSION=//p' .devcontainer/Dockerfile)
          test -n "$version" || { echo "GOLANGCI_LINT_VERSION not found in .devcontainer/Dockerfile"; exit 1; }
          echo "version=v${version}" >> "$GITHUB_OUTPUT"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci-lint-version.outputs.version }}
          working-directory: src/api
      # the release binary, not `go run`: compiling vacuum takes minutes on every run
      # version and checksum from the ARGs in .devcontainer/Dockerfile, shared with the dev container
      - name: install vacuum
        run: |
          version=$(sed -n 's/^ARG VACUUM_VERSION=//p' .devcontainer/Dockerfile)
          sha256=$(sed -n 's/^ARG VACUUM_SHA256_AMD64=//p' .devcontainer/Dockerfile)
          test -n "$version" && test -n "$sha256" || { echo "VACUUM_VERSION or VACUUM_SHA256_AMD64 not found in .devcontainer/Dockerfile"; exit 1; }
          archive="vacuum_${version}_linux_x86_64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/daveshanley/vacuum/releases/download/v${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" vacuum
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: openapi-lint
        run: make openapi-lint VACUUM=vacuum

  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/ui/.nvmrc
          cache: npm
          cache-dependency-path: src/ui/package-lock.json
      - name: install
        run: make ui-install
      - name: format
        run: make ui-fmt-check
      - name: lint
        run: make ui-lint
      - name: test
        run: make ui-test
      - name: build
        run: make ui-build
