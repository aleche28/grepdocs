name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # only cancel on PR updates, while pushes on main still get their own run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/api/go.mod
          cache-dependency-path: src/api/go.sum
      - name: tidy
        run: make tidy-check
      - name: vet
        run: make vet
      - name: build
        run: make build
      - name: test
        run: make test-race

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/api/go.mod
          cache-dependency-path: src/api/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0 # golangci-lint version
          working-directory: src/api
      # the release binary, not `go run`: compiling vacuum takes minutes on every run
      - name: install vacuum
        env:
          VACUUM_SHA256: fd08ed9bb27f84c740008029ba992681046479ea5f745108ea3fd87d3988fd47 # linux_x86_64
        run: |
          version=$(sed -n 's/^VACUUM_VERSION *:= *v//p' Makefile)
          archive="vacuum_${version}_linux_x86_64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/daveshanley/vacuum/releases/download/v${version}/${archive}"
          echo "${VACUUM_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" vacuum
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: openapi-lint
        run: make openapi-lint VACUUM=vacuum
