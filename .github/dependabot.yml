version: 2

updates:
  - package-ecosystem: gomod
    directory: /src/api
    schedule:
      interval: weekly
      day: monday
    # wait a few days before proposing a fresh release, so a compromised or broken
    # version has time to be caught upstream; security updates are not delayed
    cooldown:
      default-days: 3
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /src/ui
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
