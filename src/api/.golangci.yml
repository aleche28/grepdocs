version: "2"

linters:
  default: standard
  enable:
    - asciicheck
    - bodyclose
    - errorlint
    - gocognit
    - godoclint
    - gosec
    - misspell
    - noctx
  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - errcheck
          - gocognit
          - gosec
          - noctx
  settings:
    errcheck:
      exclude-functions:
        - "(io.Closer).Close"
    gosec:
      excludes:
        - G104

formatters:
  enable:
    # the order matters
    - gofumpt
    - gci
  settings:
    gofumpt:
      module-path: grepdocs/api
    gci:
      sections:
        - standard
        - default
        - localmodule

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
